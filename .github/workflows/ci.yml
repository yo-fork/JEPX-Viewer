name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# テストとビルドだけなので、リポジトリの設定に関係なくコードの読み取り権限だけを与える
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
