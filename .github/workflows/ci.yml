name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# テストとビルドだけなので、リポジトリの設定に関係なくコードの読み取り権限だけを与える
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 実際のビルド結果から 1 ファイル版を作れること（Vite の出力形式が変わったときに気づけるように）
      - run: npx tsx scripts/build-single.ts --no-data
