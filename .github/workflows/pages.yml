# GitHub Pages へ手動でデプロイする（リポジトリの Settings → Pages → Source を「GitHub Actions」にしてから実行）
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      include_data:
        description: 'JEPX から価格データを取得してサイトに含める（公開する場合は JEPX の利用条件を確認してください）'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 過去年度のファイルはキャッシュから復元し、今年度・前年度だけを取り直す
      - uses: actions/cache@v4
        if: ${{ inputs.include_data }}
        with:
          path: public/data/spot
          key: jepx-spot-${{ github.run_id }}
          restore-keys: jepx-spot-
      - name: Fetch JEPX spot market data
        if: ${{ inputs.include_data }}
        run: npm run fetch
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
